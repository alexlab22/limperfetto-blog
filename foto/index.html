<script>
(()=>{const dialog=document.querySelector('dialog'),photos=[...document.querySelectorAll('figure')];let current=0,trigger;
function show(index){current=(index+photos.length)%photos.length;const p=photos[current],img=p.querySelector('img');document.getElementById('large').src=img.dataset.full;document.getElementById('large').alt=img.alt;document.getElementById('title').textContent=(p.querySelector('strong')?.textContent || '');document.getElementById('description').textContent=p.querySelector('p').textContent;document.getElementById('position').textContent=(current+1)+' / '+photos.length;}
document.querySelectorAll('[data-photo]').forEach(b=>b.addEventListener('click',event=>{if(event.button!==0||event.metaKey||event.ctrlKey||event.shiftKey||event.altKey)return;event.preventDefault();trigger=b;show(photos.indexOf(b.closest('figure')));dialog.showModal();document.getElementById('close').focus()}));
function close(){dialog.close();trigger?.focus()}document.getElementById('close').onclick=close;dialog.addEventListener('cancel',e=>{e.preventDefault();close()});document.getElementById('prev').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);dialog.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){e.preventDefault();show(current-1)}if(e.key==='ArrowRight'){e.preventDefault();show(current+1)}});let touchX;dialog.addEventListener('touchstart',e=>{touchX=e.touches.length===1?e.touches[0].clientX:undefined},{passive:true});dialog.addEventListener('touchend',e=>{if(touchX!==undefined){const delta=e.changedTouches[0].clientX-touchX;if(Math.abs(delta)>70)show(current+(delta<0?1:-1));touchX=undefined}},{passive:true});})();
